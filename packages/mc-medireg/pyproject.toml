[project]
name = "mc-medireg"
version = "0.1.0"
description = "P1 MediReg 械规通：医疗器械注册路径知识引擎"
requires-python = ">=3.11"
dependencies = [
    "mc-domain",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[tool.uv.sources]
mc-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mc_medireg"]
