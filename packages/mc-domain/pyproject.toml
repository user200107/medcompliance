[project]
name = "mc-domain"
version = "0.1.0"
description = "医疗器械法规领域底座：分类目录树、法规版本时效、产品主数据、分类判定引擎"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.30",
    "pydantic>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mc_domain"]
