[project]
name = "mc-dossier"
version = "0.0.0"
description = "P3 DossierReview 卷宗审查：申报资料跨文档一致性与完整性（未实现）"
requires-python = ">=3.11"
dependencies = [
    "mc-domain",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
mc-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mc_dossier"]
